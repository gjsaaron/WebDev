<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSON PROJECT</title>
  <link rel="icon" type="image/png" href="/assets/img/Logo.png" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;900&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="assets/style/style.css">

  <link rel="preload" as="image" href="assets/members/aaron/aaronBg.webp">
  <link rel="preload" as="image" href="assets/members/aaron/aaronNoBg.webp">
  <link rel="preload" as="image" href="assets/members/aaron/aaronBox.webp">
</head>

<body>

  <div id="loader">
    <div class="spin"></div>
    <span style="font-family:'Bangers',cursive; letter-spacing:4px; color:var(--accent)">
      LOADING SQUAD…
    </span>
  </div>

  <div id="bg-glow"></div>

  <header>
    <div class="container-xl">
      <div class="row justify-content-center">
        <div class="col-auto">
          <p class="header-sub">Get to know our squad!</p>
          <h1 class="header-title" id="squad-title">SYNC</h1>
        </div>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="container-xl w-100">
      <div class="row align-items-center justify-content-center g-4">
        <div class="col-auto align-self-center">
          <div class="photo-strip" id="photo-strip"></div>
        </div>
        <div class="col-7 col-sm-5 col-md-5 col-lg-5 col-xl-4">
          <div id="center-showcase">
            <div class="center-frame">
              <img id="center-img" src="" alt="" draggable="false">
            </div>
          </div>
        </div>
        <div class="col-12 col-md col-lg-5 align-self-start">
          <div id="right-panel">
            <p class="member-role-tag" id="member-role">—</p>
            <h2 class="member-name" id="member-name">—</h2>
            <p class="member-meta" id="member-meta">—</p>
            <p class="member-quote" id="member-quote">—</p>
            <a class="member-social-link" id="member-social" href="#" target="_blank" rel="noopener">
              <i class="bi" id="social-icon"></i>
              <span id="social-label">Social</span>
            </a>
            <hr class="panel-divider">
            <p class="other-label">Other Members:</p>
            <div id="other-grid"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container-fluid">
      SYNC &copy; 2026 &nbsp;·&nbsp; Funko Pop Showcase &nbsp;
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const TRANSITION_MS = 350;

    let allMembers = [];
    let activeMember = 0;
    let activePhoto = 0;
    let isAnimating = false;

    const loader = document.getElementById('loader');
    const squadTitle = document.getElementById('squad-title');
    const photoStrip = document.getElementById('photo-strip');
    const centerShowcase = document.getElementById('center-showcase');
    const centerImg = document.getElementById('center-img');
    const rightPanel = document.getElementById('right-panel');
    const memberRole = document.getElementById('member-role');
    const memberName = document.getElementById('member-name');
    const memberMeta = document.getElementById('member-meta');
    const memberQuote = document.getElementById('member-quote');
    const memberSocial = document.getElementById('member-social');
    const socialIcon = document.getElementById('social-icon');
    const socialLabel = document.getElementById('social-label');
    const otherGrid = document.getElementById('other-grid');

    const PHOTO_LABELS = ['Main', 'Alt', 'Box'];

    function switchPhoto(photoIndex) {
      if (photoIndex === activePhoto) return;
      activePhoto = photoIndex;

      centerShowcase.classList.add('fading');
      setTimeout(() => {
        centerImg.src = allMembers[activeMember].images[activePhoto];
        centerShowcase.classList.remove('fading');

        document.querySelectorAll('.photo-thumb').forEach((el, i) =>
          el.classList.toggle('active', i === activePhoto));
      }, TRANSITION_MS);
    }

    async function switchMember(memberIndex) {
      if (isAnimating || memberIndex === activeMember) return;
      isAnimating = true;

      const thumbs = otherGrid.querySelectorAll('.other-thumb');
      const clickedEl = thumbs[memberIndex];
      if (clickedEl) clickedEl.classList.add('loading');

      try {
        const res = await fetch(`data/members.json?t=${Date.now()}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        allMembers = data.members;

        [centerShowcase, rightPanel].forEach(el => el.classList.add('fading'));

        setTimeout(() => {
          activeMember = memberIndex;
          activePhoto = 0;
          renderAll();

          [centerShowcase, rightPanel].forEach(el => el.classList.remove('fading'));
          setTimeout(() => { isAnimating = false; }, TRANSITION_MS);
        }, TRANSITION_MS);

      } catch (err) {
        console.error('[switchMember] JSON fetch failed:', err);
        if (clickedEl) clickedEl.classList.remove('loading');
        isAnimating = false;
      }
    }

    function renderAll() {
      const m = allMembers[activeMember];

      applyAccent(m.accent_color || '#F5C518');

      centerImg.src = m.images[activePhoto];
      centerImg.alt = `${m.name} — Photo ${activePhoto + 1}`;

      photoStrip.innerHTML = m.images.map((src, i) => `
        <button class="photo-thumb${i === activePhoto ? ' active' : ''}"
                data-pi="${i}"
                aria-label="${escHtml(PHOTO_LABELS[i] || 'Photo ' + (i + 1))} view of ${escHtml(m.name)}">
          <img src="${src}" alt="Photo ${i + 1}" loading="lazy" draggable="false">
        </button>`
      ).join('');

      photoStrip.querySelectorAll('.photo-thumb').forEach(btn =>
        btn.addEventListener('click', () => switchPhoto(+btn.dataset.pi))
      );

      memberRole.textContent = m.role;
      memberName.textContent = m.name;
      memberMeta.textContent = `${m.series}  ·  Edition ${m.edition}`;
      memberQuote.textContent = m.quote;
      memberSocial.href = m.social.url;
      socialIcon.className = `bi ${m.social.icon}`;
      socialLabel.textContent = m.social.label;

      let otherHTML = '';
      for (let i = 0; i < allMembers.length; i++) {
        const om = allMembers[i];
        otherHTML += `
        <button class="other-thumb${i === activeMember ? ' active' : ''}"
                data-mi="${i}"
                title="${escHtml(om.name)}"
                aria-label="View ${escHtml(om.name)}">
          <img src="${om.images[2]}" alt="${escHtml(om.name)}" loading="lazy" draggable="false">
        </button>`;
      }
      otherGrid.innerHTML = otherHTML;

      otherGrid.querySelectorAll('.other-thumb').forEach(btn =>
        btn.addEventListener('click', () => switchMember(+btn.dataset.mi))
      );
    }

    const bgGlowEl = document.getElementById('bg-glow');

    function applyAccent(hex) {
      const glow = hexToRgba(hex, 0.30);
      const glowStrong = hexToRgba(hex, 0.55);
      const glowFaint = hexToRgba(hex, 0.12);

      document.documentElement.style.setProperty('--accent', hex);
      document.documentElement.style.setProperty('--accent-glow', glow);
      document.documentElement.style.setProperty('--accent-glow-strong', glowStrong);

      bgGlowEl.style.background = `
        radial-gradient(ellipse at 38% 55%, ${glowFaint} 0%, transparent 55%),
        radial-gradient(ellipse at 72% 35%, ${hexToRgba(hex, 0.08)} 0%, transparent 50%)`;
    }

    function hexToRgba(hex, alpha) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function escHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function init() {
      try {
        const res = await fetch('data/members.json');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        allMembers = data.members;
        squadTitle.textContent = data.squad;

        renderAll();

        loader.classList.add('gone');
        setTimeout(() => loader.remove(), 500);

      } catch (err) {
        console.error('[init] Failed:', err);
        loader.innerHTML = `
          <i class="bi bi-exclamation-triangle" style="font-size:2rem;color:#f44444"></i>
          <span style="font-family:'Bangers',cursive;letter-spacing:2px;color:#f44444">
            Failed to load members.json
          </span>
          <small style="color:#666;font-size:.8rem">${escHtml(err.message)}</small>`;
      }
    }

    init();
  </script>
</body>

</html>
